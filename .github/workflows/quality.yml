name: Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_NAME: L4rs0n
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/l4rs0n
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-secret-value-with-at-least-32-characters
      SMTP_FROM: noreply@example.com
      CLUB_NAME: L4rs0n

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
